name: Check Spelling

# Comment management is handled through a secondary job, for details see:
# https://docs.check-spelling.dev/Feature%3A-Restricted-Permissions
#
# `jobs.comment-push` runs when a push is made to a repository and the `jobs.spelling` job needs to make a comment
#   (in odd cases, it might actually run just to collapse a comment, but that's fairly rare)
#   it needs `contents: write` in order to add a comment.
#
# `jobs.comment-pr` runs when a pull_request is made to a repository and the `jobs.spelling` job needs to make a comment
#   or collapse a comment (in the case where it had previously made a comment and now no longer needs to show a comment)
#   it needs `pull-requests: write` in order to manipulate those comments.

# Updating pull request branches is managed via comment handling.
# For details, see: https://docs.check-spelling.dev/Feature:-Update-expect-list
#
# These elements work together to make it happen:
#
# `on.issue_comment`
#   This event listens to comments by users asking to update the metadata.
#
# `jobs.update`
#   This job runs in response to an issue_comment and will push a new commit
#   to update the spelling metadata.
#
# `with.experimental_apply_changes_via_bot`
#   Tells the action to support and generate messages that enable it
#   to make a commit to update the spelling metadata.
#
# `with.ssh_key`
#   In order to trigger workflows when the commit is made, you can provide a
#   secret (typically, a write-enabled github deploy key).
#
#   For background, see: https://docs.check-spelling.dev/Feature:-Update-with-deploy-key

# Sarif reporting
#
# Access to Sarif reports is generally restricted (by GitHub) to members of the repository.
#
# Requires enabling `security-events: write`
# and configuring the action with `use_sarif: 1`
#
#   For information on the feature, see: https://docs.check-spelling.dev/Feature:-SARIF-output

# Minimal workflow structure:
#
# on:
#   push:
#     ...
#   pull_request_target:
#     ...
# jobs:
#   # you only want the spelling job, all others should be omitted
#   spelling:
#     # remove `security-events: write` and `use_sarif: 1`
#     # remove `experimental_apply_changes_via_bot: 1`
#     ... otherwise adjust the `with:` as you wish

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  pull_request_target:
    branches:
      - "**"
    types:
      - "opened"
      - "reopened"
      - "synchronize"

jobs:
  spelling:
    name: Check Spelling
    permissions:
      contents: read
      pull-requests: read
      actions: read
      security-events: write
    env:
      workflow_check_commit_messages: commits
    runs-on: ubuntu-latest
    if: ${{
      contains(github.event_name, 'pull_request') ||
      github.event_name == 'push'
      }}
    steps:
      - name: Suppress git default branch message
        id: quiet
        shell: bash
        run: |
          : Suppress git default branch message
          if git config --global init.defaultBranch|grep -q .; then
            exit 0
          fi
          git config --global init.defaultBranch silence_warning_about_default_branch
          echo 'cleanup=1' >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: ${{ !contains(env.workflow_check_commit_messages, 'commits') && '1' || '2147483647' }}
          filter: ${{ contains(env.workflow_check_commit_messages, 'commits') && 'tree:0' || '' }}
        env:
          GIT_CURL_VERBOSE: True
          GIT_TRACE: True
          GIT_SSH_COMMAND: ssh -v -v -v
      - name: Test (clean)
        shell: bash
        run: |
          git clone . ../introspected/
          mv ../introspected .
          cp .git/config introspected/.git
      - name: Test (merge)
        if: ${{ contains(github.event_name, 'pull_request') }}
        uses: ./actions/checkout-merge
        with:
          path: introspected
        env:
          GIT_CURL_VERBOSE: True
          GIT_TRACE: True
          GIT_SSH_COMMAND: ssh -v -v -v
      - name: Run check-spelling
        if: env.MERGE_FAILED != '1'
        id: spelling
        uses: ./
        with:
          suppress_push_for_open_pull_request: 1
          check_file_names: 1
          config: introspected/.github/actions/spelling
          experimental_path: introspected
          spell_check_this: check-spelling/spell-check-this@prerelease
          checkout: false
          post_comment: 0
          use_magic_file: 1
          report-timing: 1
          experimental_apply_changes_via_bot: ${{ github.repository_owner != 'check-spelling' && 1 || '' }}
          use_sarif: ${{ (!github.event.pull_request || (github.event.pull_request.head.repo.full_name == github.repository)) && 1 }}
          extra_dictionary_limit: 10
          # this repository doesn't use php, but the dictionary has fairly good coverage
          extra_dictionaries: |
            cspell:software-terms/dict/softwareTerms.txt
            cspell:php/dict/php.txt
            cspell:node/node.txt
            cspell:python/src/python/python-lib.txt
            cspell:shell/dict/shell-all-words.txt
          check_commit_messages: ${{ env.workflow_check_commit_messages }}
          ignore-pattern: '[^\p{Ll}\p{Lm}\p{Lt}\p{Lu}]'
          upper-pattern: '[\p{Lu}\p{Lt}\p{Lm}]'
          lower-pattern: '[\p{Ll}\p{Lm}]'
          not-lower-pattern: '[^\p{Ll}\p{Lm}]'
          not-upper-or-lower-pattern: '[^\p{Lu}\p{Lt}\p{Lm}]'
          punctuation-pattern: "'"
